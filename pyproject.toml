[project]
name = "receipts"
version = "1.1.0"
description = "Claude Code skill that makes the agent prove its work before it says done"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Ernest Kosmatko" }]
keywords = ["claude-code", "agent-skills", "verification", "testing", "screenshots"]

[project.optional-dependencies]
dev = ["pytest>=7"]

[tool.pytest.ini_options]
testpaths = ["tests"]
